<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Inscripción a Taller de Robótica</title>

</head>

<body>

    <header>

        <h1>Formulario de Inscripción al Taller</h1>

        <p>Complete sus datos para solicitar plaza en el Taller de Robótica 2026</p>

    </header>

    <main>

        <hr>
        
        <br>

        <form action="" method="post">

            <fieldset>

                <legend>Datos de Inscripción del Alumno</legend>

                <label for="nombre">Nombre y Apellidos (Obligatorio):</label>

                <br>

                <input id="nombre" type="text" name="nombre" placeholder="Ejemplo: Víctor Fabero" required="required">

                <br><br>

                <label for="correo">Correo electrónico personal (Obligatorio):</label>

                <br>

                <input id="correo" type="email" name="correo" placeholder="usuario@correo.com" required="required">

                <br><br>

                <label for="telefono">Teléfono móvil de contacto:</label>

                <br>

                <input id="telefono" type="tel" name="telefono" placeholder="654213584" required="required">

                <br><br>

                <label for="fecha">Fecha preferida para el taller (dd/mm/aaaa):</label>

                <br>

                <input id="fecha" type="date" name="fecha" placeholder="dd/mm/aaaa" required="required">

            </fieldset>

        </form>

        <button>Reservar plaza</button>

        <button>Borrar Formulario</button>

        <hr>

    </main>

    <footer>

        <p>&copy; 2026 Material Docente de Lenguaje de Marcas. Ejercicio Práctico de Formularios.</p>

    </footer>

</body>

<style>

    body{
        color: darkgray;
        font-family: Arial, Helvetica, sans-serif;
    }

    form{
        padding: 10px;
    }

    label, input{
        color: black;
        text-align: left;
    }

    button{
        padding: 3px;
    }

</style>

</html>
